---
name: "Update external-provisioner version"

sources:
  upstream:
    name: Get external-provisioner version
    kind: githubrelease
    spec:
      owner: kubernetes-csi
      repository: external-provisioner
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver

targets:
  tagfile:
    name: "Bump to latest external-provisioner version in TAG"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'
      replacepattern: '{{ source "upstream" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: 'Bump external-provisioner version to {{ source "upstream" }}'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      labels:
        - updatecli
    scmid: default
