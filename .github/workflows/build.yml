name: Build
on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build hardened-csi-provisioner image
      run: make build-image-csi-provisioner

    - name: Download VEX metadata
      shell: bash
      run: |
        set -euo pipefail

        curl \
          --fail \
          --retry 3 \
          --retry-all-errors \
          --output "$GITHUB_WORKSPACE/.rancher.openvex.json.meta" \
          https://raw.githubusercontent.com/rancher/vexhub/refs/heads/main/reports/rancher.openvex.json

    - name: Restore Rancher VEX report
      id: vex-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/rancher.openvex.json
        key: rancher-vex-v1-${{ hashFiles('.rancher.openvex.json.meta') }}

    - name: Enable VEX report when available
      shell: bash
      run: |
        vex_file="$RUNNER_TEMP/rancher.openvex.json"

        if [[ -s "$vex_file" ]]; then
          echo "Using cached Rancher VEX report"
          echo "TRIVY_VEX=$vex_file" >> "$GITHUB_ENV"
          echo "TRIVY_SHOW_SUPPRESSED=true" >> "$GITHUB_ENV"
        else
          echo "::warning::Rancher VEX cache is unavailable; scanning without VEX"
          echo "TRIVY_VEX=" >> "$GITHUB_ENV"
        fi

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

    - name: Scan hardened-csi-provisioner image for vulnerabilities
      run: make image-scan
